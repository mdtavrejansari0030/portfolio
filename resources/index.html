<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Resources] | Md Tavrej Ansari</title>
  <meta name="description" content="[SEO Page Meta Description: Resource directory and download catalog. Professional tools, assets and design guides ready for dynamic indexing.]">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <global-navbar></global-navbar>

  <main>
    <!-- Page Hero Header -->
    <header class="section-hero section pb-md" aria-label="Page Title Banner">
      <div class="container">
        <div class="breadcrumbs">
          <a href="/">Home</a>
          <span class="breadcrumbs-separator"></span>
          <span>Resources</span>
        </div>
        <h1 style="font-size: var(--font-size-xxl); font-weight: var(--fw-bold); color: var(--color-text-primary); margin-top: var(--space-sm); line-height: var(--lh-heading);">
          Free Marketing & CRO Resources
        </h1>
        <p style="font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: var(--lh-body); max-width: 600px; margin-top: var(--space-xs);">
          Download templates, checklists and blueprints to audit your conversion tracking, structure your ad campaigns and optimize your landing pages.
        </p>
      </div>
    </header>

    <!-- Search & Filters -->
    <section class="section pt-0 pb-lg" aria-label="Filters and Search Box">
      <div class="container">
        <div class="search-filter-area" style="display: flex; flex-wrap: wrap; gap: var(--space-md); justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-md);">
          <div class="search-bar-wrapper" style="position: relative; flex: 1; max-width: 400px;">
            <input type="search" id="resources-search-input" class="search-input" placeholder="Search resources..." aria-label="Search Resources Input"
              style="width: 100%; padding: var(--space-xs) var(--space-md) var(--space-xs) 2.5rem; background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-primary); font-size: var(--font-size-sm);">
            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 14px;">🔍</span>
          </div>
          <div class="filter-group" style="display: flex; gap: var(--space-xs);">
            <button class="filter-pill active" data-resources-filter="all" style="background: var(--color-accent); color: var(--color-bg-primary); border: none; padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-xxs); font-weight: var(--fw-semibold); cursor: pointer;">All Formats</button>
            <button class="filter-pill" data-resources-filter="Checklists" style="background: var(--color-bg-secondary); color: var(--color-text-secondary); border: 1px solid var(--color-border); padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-xxs); font-weight: var(--fw-semibold); cursor: pointer;">Checklists</button>
            <button class="filter-pill" data-resources-filter="Templates" style="background: var(--color-bg-secondary); color: var(--color-text-secondary); border: 1px solid var(--color-border); padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-xxs); font-weight: var(--fw-semibold); cursor: pointer;">Templates</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Resources Catalog Grid -->
    <section class="section pt-0" aria-label="Resources Grid Library">
      <div class="container">
        <div class="grid-12" id="resources-list-grid" style="gap: var(--grid-gap);">
          <!-- Dynamic Content loaded by cms-loader.js -->
        </div>
      </div>
    </section>
  </main>

  <global-footer></global-footer>

  <script src="/js/components.js"></script>
  <script src="/js/main.js"></script>
  <script src="../data/db.js"></script>
  <script src="/js/cms-loader.js"></script>
</body>
</html>
