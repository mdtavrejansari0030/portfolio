<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Case Studies] | Md Tavrej Ansari</title>
  <meta name="description" content="[SEO Page Meta Description: Overview of clinical and system case studies. Filterable analytical breakdowns ready for dynamic integration.]">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <global-navbar></global-navbar>

  <main>
    <!-- Page Hero Header -->
    <header class="section-hero section pb-md" aria-label="Page Title Header">
      <div class="container">
        <div class="breadcrumbs">
          <a href="/">Home</a>
          <span class="breadcrumbs-separator"></span>
          <span>Case Studies</span>
        </div>
        <h1 class="hero-title" style="margin-top: var(--space-sm);">Case Studies</h1>
        <p class="max-w-prose" style="color: var(--color-text-secondary); margin-top: var(--space-xs);">
          In-depth analyses of conversion strategies, user experience decisions and growth marketing systems.
        </p>
      </div>
    </header>

    <!-- Search & Filters -->
    <section class="section pt-0 pb-lg" aria-label="Search and Filter Block">
      <div class="container">
        <div class="search-filter-area" style="display: flex; flex-wrap: wrap; gap: var(--space-md); justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-md);">
          <div class="search-bar-wrapper" style="position: relative; flex: 1; max-width: 400px;">
            <input type="search" id="case_studies-search-input" class="search-input" placeholder="Search Case Studies..." aria-label="Search Case Studies Input"
              style="width: 100%; padding: var(--space-xs) var(--space-md) var(--space-xs) 2.5rem; background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text-primary); font-size: var(--font-size-sm);">
            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); font-size: 14px;">🔍</span>
          </div>
          <div class="filter-group" style="display: flex; gap: var(--space-xs);">
            <button class="filter-pill active" data-case_studies-filter="all" style="background: var(--color-accent); color: var(--color-bg-primary); border: none; padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-xxs); font-weight: var(--fw-semibold); cursor: pointer;">All Spheres</button>
            <button class="filter-pill" data-case_studies-filter="CRO & UX" style="background: var(--color-bg-secondary); color: var(--color-text-secondary); border: 1px solid var(--color-border); padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-xxs); font-weight: var(--fw-semibold); cursor: pointer;">CRO & UX</button>
            <button class="filter-pill" data-case_studies-filter="Growth Marketing" style="background: var(--color-bg-secondary); color: var(--color-text-secondary); border: 1px solid var(--color-border); padding: 6px 14px; border-radius: var(--radius-full); font-size: var(--font-size-xxs); font-weight: var(--fw-semibold); cursor: pointer;">Growth Marketing</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Case Studies Catalog Grid -->
    <section class="section pt-0" aria-label="Case Studies Catalog List">
      <div class="container">
        <div class="grid-12" id="case_studies-list-grid" style="gap: var(--grid-gap);">
          <!-- Dynamic Content loaded by cms-loader.js -->
        </div>
      </div>
    </section>
  </main>

  <global-footer></global-footer>

  <script src="/js/components.js"></script>
  <script src="/js/main.js"></script>
  <script src="../data/db.js"></script>
  <script src="/js/cms-loader.js"></script>
</body>
</html>
